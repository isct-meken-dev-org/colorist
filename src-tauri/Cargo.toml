[package]
name = "colorist"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["command-collector"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "colorist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
command-collector = { path = "command-collector" }
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["function", "collect"] }
specta-typescript = "0.0.12"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
